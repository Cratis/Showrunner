name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Setup Node (proxy generation runs during the Debug build)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      # Debug regenerates the TypeScript proxies and compiles the #if DEBUG spec code. Release is a
      # build-only check; CratisProxiesOutputPath is cleared so the proxy generator's MSBuild target
      # no-ops instead of re-running against a second compilation of already-correct generated files.
      - name: Build (Debug)
        if: matrix.configuration == 'Debug'
        run: dotnet build Showrunner.slnx --configuration Debug

      - name: Build (Release)
        if: matrix.configuration == 'Release'
        run: dotnet build Showrunner.slnx --configuration Release -p:CratisProxiesOutputPath=

      - name: Test
        if: matrix.configuration == 'Debug'
        run: dotnet test Showrunner.slnx --configuration Debug --no-build --logger "console;verbosity=minimal"

      # Packing is what publish.yml does on release; doing it here keeps a pull request from merging a
      # project that builds but does not pack. Release carries no Debug-only spec dependencies.
      - name: Pack
        if: matrix.configuration == 'Release'
        run: dotnet pack Showrunner.slnx --configuration Release --no-build -p:CratisProxiesOutputPath= -o ./Artifacts/NuGet

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The Debug backend build regenerates the TypeScript proxies into Source/JavaScript/Usher, BoxOffice, Marquee and Marquee.Authoring; the
      # frontend gate needs them present on disk (they are committed, but a PR that changes backend
      # contracts without rebuilding would otherwise pass a stale proxy through lint/tsc).
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Regenerate proxies (Debug build, no test execution needed here)
        run: dotnet build Showrunner.slnx --configuration Debug

      # The proxies are committed and published from the commit as they are (publish.yml does not regenerate
      # them), so a pull request whose backend changes were not rebuilt must fail here rather than ship stale
      # proxies. The generator leaves a file untouched when its content hash is unchanged, so a clean tree
      # means the committed proxies are exactly what the backend generates; untracked files are new proxies.
      - name: Verify the committed proxies are current
        run: |
          # Each backend project generates into its own npm package. The generator writes its state file when
          # it runs; without it a clean tree would prove nothing.
          failed=0
          for pair in Usher:Usher BoxOffice:BoxOffice Marquee:Marquee Marquee.Authoring:Marquee.Authoring; do
            project="${pair%%:*}"
            package="${pair##*:}"
            if [ ! -f "Source/DotNET/$project/obj/Debug/net10.0/cratis-proxies.state.json" ]; then
              echo "::error::The Debug build did not run the proxy generator for Source/DotNET/$project, so the committed proxies were not checked."
              failed=1
              continue
            fi
            generated="$(grep -rl --include='*.ts' '@generated by Cratis' "Source/JavaScript/$package" | wc -l)"
            if [ "$generated" -eq 0 ]; then
              echo "::error::Source/JavaScript/$package holds no generated proxies, so there is nothing to verify."
              failed=1
              continue
            fi
            status="$(git status --porcelain -- "Source/JavaScript/$package")"
            if [ -n "$status" ]; then
              echo "::error::The generated TypeScript proxies in Source/JavaScript/$package are stale. Build Showrunner.slnx in Debug and commit the regenerated proxies."
              echo "$status"
              git --no-pager diff -- "Source/JavaScript/$package"
              failed=1
              continue
            fi
            echo "Generated proxies are current: $generated generated files in Source/JavaScript/$package unchanged by the Debug build."
          done
          exit "$failed"

      - name: Corepack enable
        run: corepack enable

      - name: Yarn install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint:ci

      - name: TypeScript compile
        run: yarn compile

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
