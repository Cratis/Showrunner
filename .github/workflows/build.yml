name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      # Debug compiles the #if DEBUG spec code. This backend job never generates proxies: it passes
      # CratisProxiesSkip=true so the proxy generator's MSBuild target no-ops instead of re-running against
      # a second compilation of already-correct generated files. The frontend job generates and verifies them.
      - name: Build (Debug)
        if: matrix.configuration == 'Debug'
        run: dotnet build Showrunner.slnx --configuration Debug -p:CratisProxiesSkip=true

      - name: Build (Release)
        if: matrix.configuration == 'Release'
        run: dotnet build Showrunner.slnx --configuration Release -p:CratisProxiesSkip=true

      # -m:1 runs the test assemblies one after another. Each integration assembly starts its own Chronicle
      # and MongoDB containers; started together they starve each other and Chronicle event-store registration
      # misses its 30-second wait (#96).
      - name: Test
        if: matrix.configuration == 'Debug'
        run: dotnet test Showrunner.slnx --configuration Debug --no-build -m:1 --logger "console;verbosity=minimal"

      # Packing is what publish.yml does on release; doing it here keeps a pull request from merging a
      # project that builds but does not pack. Release carries no Debug-only spec dependencies.
      - name: Pack
        if: matrix.configuration == 'Release'
        run: dotnet pack Showrunner.slnx --configuration Release --no-build -p:CratisProxiesSkip=true -o ./Artifacts/NuGet

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job's Debug build (no CratisProxiesSkip) is the single build that regenerates the TypeScript proxies into Source/JavaScript/Usher, BoxOffice, Marquee and Marquee.Authoring, and the drift check below verifies them; the
      # frontend gate needs them present on disk (they are committed, but a PR that changes backend
      # contracts without rebuilding would otherwise pass a stale proxy through lint/tsc).
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Regenerate proxies (Debug build, no test execution needed here)
        run: dotnet build Showrunner.slnx --configuration Debug

      # The proxies are committed and published from the commit as they are (publish.yml does not regenerate
      # them), so a pull request whose backend changes were not rebuilt must fail here rather than ship stale
      # proxies. The generator leaves a file untouched when its content hash is unchanged, so a clean tree
      # means the committed proxies are exactly what the backend generates; untracked files are new proxies.
      - name: Verify the committed proxies are current
        run: |
          # Each backend project generates into its own npm package. The generator writes its state file when
          # it runs; without it a clean tree would prove nothing.
          failed=0
          for pair in Usher:Usher BoxOffice:BoxOffice Marquee:Marquee Marquee.Authoring:Marquee.Authoring; do
            project="${pair%%:*}"
            package="${pair##*:}"
            if [ ! -f "Source/DotNET/$project/obj/Debug/net10.0/cratis-proxies.state.json" ]; then
              echo "::error::The Debug build did not run the proxy generator for Source/DotNET/$project, so the committed proxies were not checked."
              failed=1
              continue
            fi
            generated="$(grep -rl --include='*.ts' '@generated by Cratis' "Source/JavaScript/$package" | wc -l)"
            if [ "$generated" -eq 0 ]; then
              echo "::error::Source/JavaScript/$package holds no generated proxies, so there is nothing to verify."
              failed=1
              continue
            fi
            status="$(git status --porcelain -- "Source/JavaScript/$package")"
            if [ -n "$status" ]; then
              echo "::error::The generated TypeScript proxies in Source/JavaScript/$package are stale. Build Showrunner.slnx in Debug and commit the regenerated proxies."
              echo "$status"
              git --no-pager diff -- "Source/JavaScript/$package"
              failed=1
              continue
            fi
            echo "Generated proxies are current: $generated generated files in Source/JavaScript/$package unchanged by the Debug build."
          done
          exit "$failed"

      - name: Corepack enable
        run: corepack enable

      - name: Yarn install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint:ci

      - name: TypeScript compile
        run: yarn compile

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  # Stage Manager, the operator: the chart's custom resource definitions are generated from the C# types, so a
  # chart that lints and templates here carries exactly what the operator reconciles; the image builds from the
  # same checkout.
  stage-manager:
    name: Stage Manager chart and image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: "10.0.x"

      - name: Generate the custom resource definitions
        run: ./scripts/stage-manager-crds.sh

      - name: Lint the chart
        run: helm lint Source/Helm/showrunner-operator --strict

      - name: Template the chart
        run: helm template stage-manager Source/Helm/showrunner-operator --namespace stage-manager > /dev/null

      - name: Check what the chart grants
        run: ./scripts/stage-manager-chart-checks.sh

      - name: Publish the operator
        run: dotnet publish Source/DotNET/StageManager/StageManager.csproj -c Release -p:CratisProxiesSkip=true -o Source/DotNET/StageManager/out

      - name: Build the operator image
        run: docker build -f Docker/StageManager/Dockerfile -t cratis/showrunner-operator-image:ci .

  # Installs the chart on a kind cluster and applies a Performance: a missing environment key blocks the rollout,
  # a complete environment rolls it out, only AuthProxy is public and no secret value reaches a Deployment, the
  # status or the log.
  stage-manager-kind:
    name: Stage Manager on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: "10.0.x"

      # kind, kubectl and helm are part of the runner image.
      - name: Create the cluster
        run: kind create cluster --name stage-manager --wait 120s

      - name: Run the end-to-end checks
        run: ./scripts/stage-manager-e2e.sh

      - name: Show the operator log on failure
        if: failure()
        run: kubectl -n stage-manager logs deployment/stage-manager-showrunner-operator --tail=200 || true
