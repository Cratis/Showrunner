name: Publish

# Never cancel a release in flight, and keep up to 100 pending Publish runs in FIFO order with
# `queue: max`: the default single pending slot drops the older pending release when a third merge
# arrives. Runs remain serialized and in-flight releases are never cancelled. `cancel-in-progress` is
# omitted because GitHub rejects it together with `queue: max`. See cratis/release-action's README
# ("Choosing a trigger") for why push is the recommended trigger.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

env:
  NODE_VERSION: "22.x"
  # Exact npm used to publish; trusted publishing needs >= 11.5.1. Bump deliberately.
  NPM_VERSION: "11.6.2"
  NUGET_OUTPUT: ./Artifacts/NuGet
  NPM_OUTPUT: ./Artifacts/npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        default: "0.0.0"
        type: string
      release-notes:
        description: "Release notes"
        required: true
        default: "No release notes"
        type: string
  # Label-based releasing: merging a PR with a major/minor/patch label bumps the version and
  # publishes. cratis/release-action reads the label to compute the next semantic version. Push
  # (rather than pull_request: closed) is deliberate - a merged pull request from a fork runs with
  # a read-only GITHUB_TOKEN even on merge, so it could not create the release or push packages; a
  # push to main always carries a full-permission token, and the action finds the merged pull
  # request and its label from the commit. There is no paths filter: the merged pull request's
  # label decides whether anything is released, so a labelled pull request that only touched, say,
  # documentation still cuts its release, and a no-release one publishes nothing.
  push:
    branches:
      - main

# Nothing by default; each job asks for exactly what it needs. Only the publish-only jobs, which run
# no build or install script, hold an OIDC token.
permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Creates the tag and the GitHub release.
      contents: write
      # Reads the merged pull request and its label.
      pull-requests: read
      # Closes the issues the release notes deliver with (#n).
      issues: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      reason: ${{ steps.release.outputs.reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Release
        id: release
        uses: cratis/release-action@26976c4c37ac8c0454077c0f41abb31650e36405 # v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  # Packing runs the build, so it holds no publishing rights: it only uploads the packages for the
  # publish job below.
  pack-nuget:
    name: Pack NuGet packages
    if: needs.release.outputs.publish == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate the version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Release carries none of the Debug-only spec dependencies (see Source/DotNET/Directory.Build.props).
      # CratisProxiesOutputPath is cleared so the proxy generator's MSBuild target no-ops for this Release
      # build instead of rewriting the committed proxies (they were verified fresh by build.yml before
      # this merged). Packing the solution packs every project under the same version, so Usher's
      # dependency on Usher.Contracts carries the released version.
      - name: Pack NuGet packages
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: >
          dotnet pack Showrunner.slnx
          --configuration Release
          -p:CratisProxiesOutputPath=
          "-p:Version=$VERSION"
          -o "$NUGET_OUTPUT"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: ${{ env.NUGET_OUTPUT }}/*.nupkg
          if-no-files-found: error
          retention-days: 7

  # Every Cratis.Showrunner.* package (Usher, Marquee, Box Office and their contracts) via NuGet.org trusted publishing
  # (OIDC) - no long-lived API key secret to hold or rotate. The trusted-publishing policy on
  # nuget.org is bound to this workflow file (publish.yml) by name, so the job must live here rather
  # than in a separately named workflow. It checks out and builds nothing: it pushes what pack-nuget
  # packed.
  publish-nuget:
    name: Push NuGet packages
    needs: [release, pack-nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required for NuGet trusted publishing using OIDC tokens.
      id-token: write

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-packages
          path: ${{ env.NUGET_OUTPUT }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      # Get a short-lived NuGet API key.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push --skip-duplicate "$NUGET_OUTPUT/*.nupkg" --timeout 900 --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  # Building and packing runs yarn and the packages' build scripts, so it holds no publishing rights.
  # run-task-on-workspaces.js pack-version sets every workspace (and every dependency on a sibling
  # workspace) to the released version, packs a tarball of each and records the order to publish in,
  # so @cratis/showrunner.usher.react pins the @cratis/showrunner.usher it was released with.
  pack-npm:
    name: Build and pack npm packages
    if: needs.release.outputs.publish == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate the version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Corepack enable
        run: corepack enable

      - name: Yarn install
        run: yarn install --immutable

      # npm 10 (bundled with Node 22) runs the prepare script during npm pack even with
      # --ignore-scripts, which mixes build output into npm pack --json. Pack with the same pinned
      # npm the publish job uses.
      - name: Install npm for packing
        run: |
          npm install -g --ignore-scripts "npm@$NPM_VERSION"
          echo "Installed npm $(npm --version)"

      - name: Build and pack npm packages
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          yarn build
          node ./run-task-on-workspaces.js pack-version "$VERSION" "$NPM_OUTPUT"

      - name: Upload npm packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-packages
          path: |
            ${{ env.NPM_OUTPUT }}/*.tgz
            ${{ env.NPM_OUTPUT }}/publish-order.txt
          if-no-files-found: error
          retention-days: 7

  # Every @cratis/showrunner.* package (usher, usher.react, marquee, marquee.authoring) via npm trusted publishing (OIDC) with
  # provenance - no long-lived npm token. It installs and builds nothing: publish-tarballs.cjs
  # publishes the tarballs pack-npm packed, in dependency order, with lifecycle scripts disabled.
  publish-npm:
    name: Publish npm packages
    needs: [release, pack-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required for npm trusted publishing and provenance using OIDC tokens.
      id-token: write

    steps:
      # Only the publish script is needed from the repository.
      - name: Checkout the publish script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/publish-tarballs.cjs
          sparse-checkout-cone-mode: false

      - name: Download npm packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-packages
          path: ${{ env.NPM_OUTPUT }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Configure npm for OIDC-based publishing
        run: |
          # setup-node writes a placeholder _authToken (XXXXX-XXXXX-XXXXX-XXXXX) into
          # .npmrc and exports NODE_AUTH_TOKEN with the same placeholder. npm uses this
          # token as-is for registry auth → 404. Remove it so npm falls back to OIDC.
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

      - name: Install npm for trusted publishing
        run: |
          npm install -g --ignore-scripts "npm@$NPM_VERSION"
          echo "Installed npm $(npm --version)"

      - name: Publish npm packages
        run: node scripts/publish-tarballs.cjs "$NPM_OUTPUT"

  # A merged pull request that publishes nothing is the failure mode that silently costs a release:
  # the release job succeeds, every publish job is skipped for want of should-publish, and the
  # whole run reports green. Fail instead, so a release that did not happen cannot be mistaken for
  # one that did. Only for the reasons that mean something went wrong - publishing nothing is
  # correct and routine for the others, such as a commit pushed straight to main or a re-run of a
  # run that already released. See cratis/release-action's README, "Acting on the reason".
  verify-published:
    name: Verify a release was actually published
    if: always() && needs.release.result == 'success' && contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason)
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}

    steps:
      - name: Report that nothing was published
        env:
          REASON: ${{ needs.release.outputs.reason }}
        run: |
          echo "::error::Nothing was published and no release was cut (reason: $REASON). Add exactly one of major, minor, patch or no-release to the merged pull request and re-run this workflow - see verify-pull-request-policy, which is meant to catch this before the merge."
          exit 1
