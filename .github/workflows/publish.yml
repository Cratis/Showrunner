name: Publish

# Never cancel a release in flight, and keep up to 100 pending Publish runs in FIFO order with
# `queue: max`: the default single pending slot drops the older pending release when a third merge
# arrives. Runs remain serialized and in-flight releases are never cancelled. `cancel-in-progress` is
# omitted because GitHub rejects it together with `queue: max`. See cratis/release-action's README
# ("Choosing a trigger") for why push is the recommended trigger.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

env:
  NODE_VERSION: "22.x"
  NUGET_OUTPUT: ./Artifacts/NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        default: "0.0.0"
        type: string
      release-notes:
        description: "Release notes"
        required: true
        default: "No release notes"
        type: string
  # Label-based releasing: merging a PR with a major/minor/patch label bumps the version and
  # publishes. cratis/release-action reads the label to compute the next semantic version. Push
  # (rather than pull_request: closed) is deliberate - a merged pull request from a fork runs with
  # a read-only GITHUB_TOKEN even on merge, so it could not create the release or push packages; a
  # push to main always carries a full-permission token, and the action finds the merged pull
  # request and its label from the commit.
  push:
    branches:
      - main
    paths:
      - "Source/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/publish.yml"

permissions:
  contents: write
  # Required for NuGet and npm trusted publishing using OIDC tokens.
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      reason: ${{ steps.release.outputs.reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  # Cratis.Showrunner.Usher and Cratis.Showrunner.Usher.Contracts via NuGet.org trusted publishing
  # (OIDC) - no long-lived API key secret to hold or rotate. The trusted-publishing policy on
  # nuget.org is bound to this workflow file (publish.yml) by name, so the job must live here rather
  # than in a separately named workflow.
  publish-nuget:
    name: Pack and push NuGet packages
    if: needs.release.outputs.publish == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Required for NuGet trusted publishing using OIDC tokens.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Remove any existing artifacts
        run: rm -rf ${{ env.NUGET_OUTPUT }}

      # Release carries none of the Debug-only spec dependencies (see Source/DotNET/Directory.Build.props).
      # CratisProxiesOutputPath is cleared so the proxy generator's MSBuild target no-ops for this Release
      # build instead of rewriting the committed proxies (they were verified fresh by build.yml before
      # this merged). Packing the solution packs both projects under the same version, so Usher's
      # dependency on Usher.Contracts carries the released version.
      - name: Pack NuGet packages
        run: >
          dotnet pack Showrunner.slnx
          --configuration Release
          -p:CratisProxiesOutputPath=
          -p:Version=${{ needs.release.outputs.version }}
          -o ${{ env.NUGET_OUTPUT }}

      # Get a short-lived NuGet API key.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet packages
        run: dotnet nuget push --skip-duplicate '${{ env.NUGET_OUTPUT }}/*.nupkg' --timeout 900 --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  # @cratis/showrunner.usher and @cratis/showrunner.usher.react via npm trusted publishing (OIDC) with
  # provenance - no long-lived npm token. run-task-on-workspaces.js publish-version sets every
  # workspace (and every dependency on a sibling workspace) to the released version and publishes in
  # dependency order, so @cratis/showrunner.usher.react pins the @cratis/showrunner.usher it was
  # released with.
  publish-npm:
    name: Build and publish npm packages
    if: needs.release.outputs.publish == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Configure npm for OIDC-based publishing
        run: |
          # setup-node writes a placeholder _authToken (XXXXX-XXXXX-XXXXX-XXXXX) into
          # .npmrc and exports NODE_AUTH_TOKEN with the same placeholder. npm uses this
          # token as-is for registry auth → 404. Remove it so npm falls back to OIDC.
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

      - name: Upgrade npm for trusted publishing (requires >= 11.5.1)
        run: |
          npm install -g npm@11
          NPM_VER="$(npm --version)"
          echo "Installed npm $NPM_VER"
          node -e "
            const v = '$NPM_VER'.split('.').map(Number);
            if (v[0] < 11 || (v[0] === 11 && v[1] < 5) || (v[0] === 11 && v[1] === 5 && v[2] < 1)) {
              console.error('npm >= 11.5.1 is required for trusted publishing, got $NPM_VER');
              process.exit(1);
            }
          "

      - name: Corepack enable
        run: corepack enable

      - name: Yarn install
        run: yarn install --immutable

      - name: Publish npm packages
        run: |
          yarn build
          yarn publish-version ${{ needs.release.outputs.version }}

      - name: Git reset (package.json files changed)
        run: git reset --hard

  # A merged pull request that publishes nothing is the failure mode that silently costs a release:
  # the release job succeeds, every publish job is skipped for want of should-publish, and the
  # whole run reports green. Fail instead, so a release that did not happen cannot be mistaken for
  # one that did. Only for the reasons that mean something went wrong - publishing nothing is
  # correct and routine for the others, such as a commit pushed straight to main or a re-run of a
  # run that already released. See cratis/release-action's README, "Acting on the reason".
  verify-published:
    name: Verify a release was actually published
    if: always() && needs.release.result == 'success' && contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason)
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Report that nothing was published
        run: |
          echo "::error::Nothing was published and no release was cut (reason: ${{ needs.release.outputs.reason }}). Add exactly one of major, minor, patch or no-release to the merged pull request and re-run this workflow - see verify-pull-request-policy, which is meant to catch this before the merge."
          exit 1
