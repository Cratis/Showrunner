apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stageapplications.showrunner.cratis.io
spec:
  group: showrunner.cratis.io
  scope: Namespaced
  names:
    kind: StageApplication
    listKind: StageApplicationList
    plural: stageapplications
    singular: stageapplication
    shortNames:
      - stageapp
    categories:
      - showrunner
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Version
          type: string
          jsonPath: .status.runningVersion
        - name: URL
          type: string
          jsonPath: .status.url
        - name: Expires
          type: string
          jsonPath: .status.expiresAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: A published Stage application, run permanently or until a given time.
          x-kubernetes-validations:
            - rule: "self.metadata.name == self.spec.publishedName"
              message: "metadata.name must equal spec.publishedName"
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - publicationId
                - organization
                - publishedName
                - version
                - image
                - lifetime
                - authentication
              x-kubernetes-validations:
                - rule: "self.publishedName == oldSelf.publishedName"
                  message: "publishedName cannot be changed"
              properties:
                publicationId:
                  type: string
                  description: The publication this application belongs to in the publisher's system.
                  minLength: 1
                organization:
                  type: string
                  description: The organization namespace (tenant) the application belongs to.
                  minLength: 1
                publishedName:
                  type: string
                  description: The DNS label the application is published under. The host is <publishedName>.<baseDomain>.
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                version:
                  type: string
                  description: The application version.
                  minLength: 1
                image:
                  type: string
                  description: The exported Stage application image, with the package baked in.
                  minLength: 1
                lifetime:
                  type: object
                  description: How long the application runs. Exactly one of permanent or until.
                  x-kubernetes-validations:
                    - rule: "(has(self.permanent) && self.permanent) != has(self.until)"
                      message: "set exactly one of permanent: true or until"
                  properties:
                    permanent:
                      type: boolean
                    until:
                      type: string
                      format: date-time
                authentication:
                  type: object
                  description: The sign-in proxy run in front of Stage. Required; an application is never run without it.
                  required:
                    - proxyImage
                    - configSecretRef
                  properties:
                    proxyImage:
                      type: string
                      minLength: 1
                    configSecretRef:
                      type: string
                      minLength: 1
                      description: The secret whose keys are the environment of the proxy.
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      default: 8080
                      x-kubernetes-validations:
                        - rule: "self != 9090 && self != 35000 && self != 27017"
                          message: "the proxy port cannot be the Stage, Chronicle or MongoDB port"
                notes:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    configSecretRef:
                      type: string
                resources:
                  type: object
                  description: Resources of the Stage container.
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                storage:
                  type: object
                  properties:
                    size:
                      type: string
                      description: The size of the application's MongoDB volume. Fixed when the volume is created.
                      default: 5Gi
            status:
              type: object
              description: Written only by the operator.
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                  enum: [Pending, Deploying, Running, RollingBack, Failed, Expired, Stopped]
                runningVersion:
                  type: string
                runningImage:
                  type: string
                url:
                  type: string
                expiresAt:
                  type: string
                dataRetainedUntil:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                versions:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    properties:
                      version:
                        type: string
                      image:
                        type: string
                      rolledOutAt:
                        type: string
                      outcome:
                        type: string
                        enum: [RolledOut, RolledBack, Failed]
                      reason:
                        type: string
                rollout:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                resourceUsage:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                lastPeriodUsage:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                currentDayUsage:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
