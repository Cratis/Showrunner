apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stage-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stage-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Never two operators at once, not even while rolling out a new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "stage-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stage-operator.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "stage-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: StageOperator__BaseDomain
              value: {{ .Values.operator.baseDomain | quote }}
            - name: StageOperator__IngressClassName
              value: {{ .Values.operator.ingressClassName | quote }}
            - name: StageOperator__TlsIssuerAnnotation
              value: {{ .Values.operator.tlsIssuerAnnotation | quote }}
            - name: StageOperator__TlsSecretName
              value: {{ .Values.operator.tlsSecretName | quote }}
            - name: StageOperator__ExpiredDataRetention
              value: {{ .Values.operator.expiredDataRetention | quote }}
            - name: StageOperator__RolloutTimeout
              value: {{ .Values.operator.rolloutTimeout | quote }}
            - name: StageOperator__MetricsSampleInterval
              value: {{ .Values.operator.metricsSampleInterval | quote }}
            - name: StageOperator__ResyncInterval
              value: {{ .Values.operator.resyncInterval | quote }}
            - name: StageOperator__MongoImage
              value: {{ .Values.operator.mongoImage | quote }}
            - name: StageOperator__StorageClassName
              value: {{ .Values.operator.storageClassName | quote }}
            - name: StageOperator__DefaultStorageSize
              value: {{ .Values.operator.defaultStorageSize | quote }}
            - name: StageOperator__NotesCollectorPort
              value: {{ .Values.operator.notesCollectorPort | quote }}
            - name: StageOperator__DenyPathsWithSnippet
              value: {{ .Values.operator.denyPathsWithSnippet | quote }}
            {{- range $index, $namespace := .Values.operator.watchNamespaces }}
            - name: StageOperator__WatchNamespaces__{{ $index }}
              value: {{ $namespace | quote }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
