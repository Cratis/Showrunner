{{- if .Values.publisher.createRole }}
# Bind this ClusterRole with a RoleBinding in each namespace the publisher publishes to.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.publisher.roleName }}
  labels:
    {{- include "stage-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["stageapplications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The publisher only reads the status; the operator is its only writer.
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["stageapplications/status"]
    verbs: ["get"]
  # The secrets an application references (spec.authentication.configSecretRef, spec.notes.configSecretRef).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
{{- end }}
