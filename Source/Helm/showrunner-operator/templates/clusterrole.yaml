# What the operator may do, and nothing more. It has no access to Secrets here: those rules are namespaced Roles
# in the managed namespaces only (secrets-role.yaml). It never touches namespaces or nodes and deletes only the
# Ingress of a Performance whose lifetime ended (owner references remove everything else a Performance created).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "showrunner-operator.fullname" . }}
  labels:
    {{- include "showrunner-operator.labels" . | nindent 4 }}
rules:
  # The resources it owns.
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["performances"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["performances/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["performances/finalizers"]
    verbs: ["update"]
  # A Performance reads the connection Secret name a Production reports.
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["productions"]
    verbs: ["get"]
  # The environment files and legal terms a Performance names.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "create", "update", "delete"]
  # Only the application of a published Stage application may be reached by its AuthProxy.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "update"]
  # CPU and memory in use by the pods of a Performance, from the metrics API (metrics-server).
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
