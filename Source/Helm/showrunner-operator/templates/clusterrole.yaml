# What the operator may do across the cluster, and nothing more: watch Performances and Productions, and read whether
# cert-manager and the Percona operator are installed. What it reads and writes for a Performance or a Production
# (Secrets, ConfigMaps, workloads, certificates, databases, routes, metrics) is granted by a Role in each managed
# namespace only (managed-namespaces-role.yaml). It never touches namespaces or nodes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "showrunner-operator.fullname" . }}
  labels:
    {{- include "showrunner-operator.labels" . | nindent 4 }}
rules:
  # The resources it owns.
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["performances"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["performances/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["performances/finalizers"]
    verbs: ["update"]
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["productions"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["productions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["productions/finalizers"]
    verbs: ["update"]
  # A Production reports a clear condition when cert-manager or the Percona operator is missing. Only these
  # definitions can be read.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - certificates.cert-manager.io
      - issuers.cert-manager.io
      - perconaservermongodbs.psmdb.percona.com
    verbs: ["get"]
  # The events it records about Performances.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
