# What the operator may do across the cluster, and nothing more: watch Performances and read Productions. What it
# reads and writes for a Performance (Secrets, ConfigMaps, workloads, routes, metrics) is granted by a Role in each
# managed namespace only (managed-namespaces-role.yaml). It never touches namespaces or nodes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "showrunner-operator.fullname" . }}
  labels:
    {{- include "showrunner-operator.labels" . | nindent 4 }}
rules:
  # The resources it owns.
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["performances"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["performances/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["performances/finalizers"]
    verbs: ["update"]
  # A Performance reads the connection Secret name a Production reports.
  - apiGroups: ["showrunner.cratis.io"]
    resources: ["productions"]
    verbs: ["get"]
  # The events it records about Performances.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
