{{- $azure := .Values.environments.azureKeyVault.workloadIdentity }}
{{- $vault := .Values.environments.hashiCorpVault }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "showrunner-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "showrunner-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "showrunner-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "showrunner-operator.selectorLabels" . | nindent 8 }}
        {{- if $azure.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "showrunner-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if $vault.kubernetesRole }}
            - name: VAULT_K8S_ROLE
              value: {{ $vault.kubernetesRole | quote }}
            {{- end }}
            {{- if $vault.authMount }}
            - name: VAULT_AUTH_MOUNT
              value: {{ $vault.authMount | quote }}
            {{- end }}
            {{- if $vault.namespace }}
            - name: VAULT_NAMESPACE
              value: {{ $vault.namespace | quote }}
            {{- end }}
            {{- if $vault.tokenSecretName }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $vault.tokenSecretName }}
                  key: token
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The environment library resolves each environment in a private temporary folder.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
