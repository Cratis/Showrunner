{{- /*
The Secrets the operator reads (passphrase, Chronicle connection) and writes (resolved environment, signing
keys). They live in the namespace of a Performance, so the operator may reach Secrets only in the namespaces
named in managedNamespaces (the release namespace when the list is empty), never cluster-wide. It never lists,
watches or deletes Secrets.
*/}}
{{- $namespaces := .Values.managedNamespaces | default (list .Release.Namespace) | uniq }}
{{- range $namespace := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "showrunner-operator.fullname" $ }}-secrets
  namespace: {{ $namespace }}
  labels:
    {{- include "showrunner-operator.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "showrunner-operator.fullname" $ }}-secrets
  namespace: {{ $namespace }}
  labels:
    {{- include "showrunner-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "showrunner-operator.fullname" $ }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "showrunner-operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
