{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "showrunner-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "showrunner-operator.labels" . | nindent 4 }}
  {{- $annotations := .Values.serviceAccount.annotations }}
  {{- if and .Values.environments.azureKeyVault.workloadIdentity.enabled .Values.environments.azureKeyVault.workloadIdentity.clientId }}
  {{- $annotations = merge (dict "azure.workload.identity/client-id" .Values.environments.azureKeyVault.workloadIdentity.clientId) $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
